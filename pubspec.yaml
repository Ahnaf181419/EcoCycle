name: eco_cycle
description: "Gamified Waste Classification & Reward Engine"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  tflite_flutter: ^0.10.0
  image_picker: ^1.0.0
  uuid: ^4.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  hugeicons: ^1.0.0
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/
